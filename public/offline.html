<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f6f1e6" />
    <title>Sem conexão · ConectaTEA</title>
    <style>
      :root {
        color-scheme: light;
        --canvas: #f6f1e6;
        --surface: #fffcf6;
        --ink: #20302b;
        --muted: #5a6962;
        --primary: #2d6b5e;
        --primary-strong: #1f5348;
        --line: #e6decd;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: radial-gradient(circle at top, #fbf6eb 0%, var(--canvas) 55%);
        color: var(--ink);
        font-family: ui-rounded, "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
      }

      main {
        width: 100%;
        max-width: 460px;
        padding: 32px 24px 28px;
        border: 1px solid var(--line);
        border-radius: 28px;
        background: var(--surface);
        box-shadow: 0 18px 44px -30px rgba(32, 48, 43, 0.45);
        text-align: center;
      }

      .logo {
        width: 96px;
        height: 96px;
        margin: 0 auto 18px;
        border-radius: 28%;
        overflow: hidden;
        background: #dcefe8;
      }

      .logo img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      h1 {
        margin: 0;
        font-size: 1.5rem;
        line-height: 1.25;
      }

      p {
        margin: 12px 0 0;
        font-size: 1rem;
        line-height: 1.55;
        color: var(--muted);
      }

      button {
        margin-top: 24px;
        width: 100%;
        min-height: 48px;
        padding: 12px 20px;
        border: 0;
        border-radius: 999px;
        background: var(--primary);
        color: #fff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      button:hover,
      button:focus-visible {
        background: var(--primary-strong);
      }

      button:focus-visible {
        outline: 3px solid #f3c36b;
        outline-offset: 3px;
      }

      .hint {
        margin-top: 16px;
        font-size: 0.8125rem;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="logo">
        <img src="mascote.jpeg" alt="Mascote do ConectaTEA" />
      </div>
      <h1>Você está sem conexão</h1>
      <p>
        O ConectaTEA precisa de internet para carregar seus dados. Suas
        informações continuam salvas e voltam assim que a conexão retornar.
      </p>
      <button type="button" onclick="window.location.reload()">
        Tentar novamente
      </button>
      <p class="hint">
        Dica: verifique o Wi-Fi ou os dados móveis do seu dispositivo.
      </p>
    </main>
  </body>
</html>
